name: Bootstrap progress

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bootstrap-progress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proofs-and-runtime:
    runs-on: ubuntu-24.04
    # Native mutation gates rebuild the actual app; keep their per-case deadlines.
    timeout-minutes: 120
    env:
      SKIP_TCP: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2
        with:
          install: false
      - name: Install native test and asset prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core librsvg2-2 libcairo2 python3-pip unzip gdb
      - name: Install the repository's Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          export ELAN_HOME="$RUNNER_TEMP/elan"
          export TMPDIR="$RUNNER_TEMP/quiet-tmp"
          export CJK_PYTHON="$RUNNER_TEMP/quiet-fonttools"
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          echo "TMPDIR=$TMPDIR" >> "$GITHUB_ENV"
          echo "CJK_PYTHON=$CJK_PYTHON" >> "$GITHUB_ENV"
          mkdir -p "$TMPDIR"
          python3 -m pip install --target "$CJK_PYTHON" fonttools==4.68.0
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/9605b24b08cf68b78dce0014b6fa01be1f8e2cee/elan-init.sh -o "$TMPDIR/elan-init.sh"
          sh "$TMPDIR/elan-init.sh" -y --default-toolchain none
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
          "$ELAN_HOME/bin/elan" toolchain install "$(cat lean-toolchain)"
          mise trust
          rustc --version
          cc --version
      - name: Run the same proof, runtime and README gates as local CI
        run: systemd-run --user --scope -p MemoryMax=48G -p MemorySwapMax=0 ci/local.sh driver check bootstrap-progress vacuity readme owned-input
      - name: Peer endpoints: laws' premises, mutation controls, and real TCP and LAN DNS-SD discovery
        run: systemd-run --user --scope -p MemoryMax=48G -p MemorySwapMax=0 ci/local.sh endpoints endpoints:mutants endpoints:net
      - name: Exercise the actual invite, approval and message UI over TCP
        run: systemd-run --user --scope -p MemoryMax=48G -p MemorySwapMax=0 bash -c 'mise run host:net-join && mise run host:write-admission'
      - name: Retain failed-reader journal notices through actual pruning
        run: systemd-run --user --scope -p MemoryMax=48G -p MemorySwapMax=0 mise run test:reader-prune
      - name: Retain reader batches through transaction startup and query failure
        run: systemd-run --user --scope -p MemoryMax=48G -p MemorySwapMax=0 mise run test:reader-claim
      - name: Check cached placeholder pixels and actual App reuse
        run: systemd-run --user --scope -p MemoryMax=48G -p MemorySwapMax=0 mise run test:hold-cache
      - name: Recover accepted local writes after the network runner fails
        run: systemd-run --user --scope -p MemoryMax=48G -p MemorySwapMax=0 mise run test:app-runner-failure
      - name: Replay channel-admitted writes across normal App suspend
        run: systemd-run --user --scope -p MemoryMax=48G -p MemorySwapMax=0 mise run test:app-suspend-journal
      - name: Keep network boot ahead of later App write arrivals
        run: systemd-run --user --scope -p MemoryMax=48G -p MemorySwapMax=0 mise run test:app-boot-admission
      - name: Retain accepted writer jobs through SQLite and diagnostic failures
        run: systemd-run --user --scope -p MemoryMax=48G -p MemorySwapMax=0 bash -c 'mise run test:writer-checkpoint && mise run test:writer-job-retry'
      - name: Preserve lifecycle outcomes and reject synchronous UI waits
        run: systemd-run --user --scope -p MemoryMax=48G -p MemorySwapMax=0 bash -c 'mise run host:lifecycle-node && mise run host:lifecycle-node-negative'
      - name: Check actual Node ID and retry-order uniqueness
        run: systemd-run --user --scope -p MemoryMax=48G -p MemorySwapMax=0 mise run test:node-uniqueness
      - name: Retain failure logs, databases and relay diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bootstrap-progress-${{ github.run_id }}
          path: |
            out/ci
            out/ci-driver
            out/fairness
            out/join-fair
            out/catalog-retry
            out/reserved-retry
            out/retry-admission
            out/node-uniqueness
            out/ingress
            out/native-lifetime
            out/ref-publications
            out/reader-prune
            out/lifecycle-node
            out/app-suspend-journal
            out/app-boot-admission
            out/app-runner-failure
            out/reader-claim
            out/hold-cache
            out/writer-fairness
            out/writer-checkpoint
            out/writer-job-retry
            out/expiry-grace
            out/close-ingress
            out/runner-ownership
            out/demand-rank
            out/simplify-negative
            out/tree-negative
            out/owned-input-core
            out/vacuity
            out/proof-links
            out/net
            out/write-admission
          if-no-files-found: warn
          retention-days: 14
