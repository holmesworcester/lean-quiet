# For a hosted runner (GitHub Actions), not in use: CI runs locally for
# now (ci/local.sh). Moved here from .github/workflows so the repository
# carries no live workflow.
# One repository, one package, one CI: each gate is a task of the root
# mise.toml, as ci/local.sh runs it. Every executable links the engine's
# Rust crypto and SQLite glue, so each job builds them. The emulator and
# Simulator suites need provisioned machines (docs/SHIPPED.md,
# platforms/ios/README.md, docs/QR.md) and run by hand or on a schedule,
# on self-hosted runners.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

env:
  ELAN_HOME: ${{ github.workspace }}/.elan
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  check:
    runs-on: ubuntu-24.04
    env: { TMPDIR: "${{ runner.temp }}" }
    steps:
      - uses: actions/checkout@v4
      - run: curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none && echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
      - uses: jdx/mise-action@v2
      - run: mise run check
      - run: mise run readme:links

  engine:
    runs-on: ubuntu-24.04
    env: { TMPDIR: "${{ runner.temp }}" }
    steps:
      - uses: actions/checkout@v4
      # libsodium only for the crypto comparison test; SQLite is vendored
      - run: sudo apt-get update && sudo apt-get install -y libsodium23
      - run: curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none && echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
      - uses: jdx/mise-action@v2
      - run: mise run test:engine
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: engine, path: "out/scenario\nout/differential\nout/lifecycle\nout/wire\nout/tcppair\nout/jointcp\nout/purge\nout/crash\nout/shipped/engine" }

  app:
    runs-on: ubuntu-24.04
    env: { TMPDIR: /tmp }
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-pil
      - run: curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none && echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
      - uses: jdx/mise-action@v2
      - run: mise run test:app
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: app, path: "out/host-twin\nout/host\nout/two\nout/net\nout/cross\nout/arrival\nout/attach\nout/shipped/app" }

  qr:
    runs-on: ubuntu-24.04
    env: { TMPDIR: "${{ runner.temp }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
          sudo apt-get update && sudo apt-get install -y qrencode zbar-tools python3-numpy python3-pil
          python3 -m pip install --user --break-system-packages segno qrcodegen
      - run: mise run test:qr
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: qr, path: "out/camera/\nout/xcheck/" }

  mdns:
    runs-on: ubuntu-24.04
    env: { TMPDIR: "${{ runner.temp }}" }
    steps:
      - uses: actions/checkout@v4
      - run: curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none && echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
      - uses: jdx/mise-action@v2
      - run: mise run test:mdns

  net:
    runs-on: ubuntu-24.04
    env: { TMPDIR: "${{ runner.temp }}" }
    steps:
      - uses: actions/checkout@v4
      - run: curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none && echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
      - uses: jdx/mise-action@v2
      - run: mise run test:net
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: net, path: out/scene }

  # Provisioned machines, by hand or on the schedule.
  engine-phone-runtime:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, lean-runtime]
    env: { TMPDIR: "${{ runner.temp }}", ELAN_HOME: /mnt/storage/elan }
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run test:engine-runtime
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-phone-runtime
          retention-days: 14
          path: |
            out/phone-runtime/**/*.log
            out/phone-runtime/tests

  app-android-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, kvm, android]
    concurrency: lean-quiet-android-twin
    env: { TMPDIR: "${{ runner.temp }}", ELAN_HOME: /mnt/storage/elan, SERIAL: emulator-5644 }
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run android:twin-demo-e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: android-e2e-twin, path: out/e2e-twin, retention-days: 14 }
  app-ios-sim-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, ios]
    concurrency: lean-quiet-ios-simulator
    env:
      TMPDIR: "${{ runner.temp }}"
      ELAN_HOME: /mnt/storage/elan
      MAC: "${{ vars.LEANQUIET_CI_MAC }}"
      MAC_DIR: lean-quiet-ios-ci
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run ios:sim-e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ios-sim-e2e, path: out/ios-sim, retention-days: 14 }
  qr-android-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, kvm, android]
    env: { TMPDIR: "${{ runner.temp }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run android:runtime && mise run android:qr-e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: qr-e2e, path: out/qr-e2e/ }
