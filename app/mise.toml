# Named tasks; CI (.github/workflows/ci.yml) runs these same tasks.
[env]
ELAN_HOME = "{{ env.ELAN_HOME | default(value='/mnt/storage/elan') }}"
TMPDIR = "{{ env.TMPDIR | default(value='/mnt/storage/holmes-tmp') }}"

[tasks."host:twin-demo"]
description = "The twin demo on the headless twin: the seam's effects from a script, checked by replies and dumped screens"
run = "tests/host_twin_demo.sh"

[tasks."android:twin-demo-apk"]
description = "The twin demo's APK (x86_64 for the emulator, arm64-v8a for phones); needs a Lean runtime for Android (LEANRT)"
run = "android/twin/build_apk.sh out/twin-demo.apk com.holmes.leanquiet 'Lean Quiet' QTests.TwinDemo x86_64 arm64-v8a"

[tasks."android:twin-demo-e2e"]
description = "End to end on a booted x86_64 emulator (SERIAL, default emulator-5644): keyboard, insets, scrolling, taps, control socket"
depends = ["android:twin-demo-apk"]
run = "android/test/twin_demo_e2e.sh \"${SERIAL:-emulator-5644}\" out/e2e-twin"

[tasks."host:app"]
description = "The app's own session without a window (QTests/Host): chaos, cold open, a fling to the top with unpainted-row counts, send and react with the writer paused (pending, then stored); screenshots in out/host"
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build host && .lake/build/bin/host ${MESSAGES:-500} out/host"

[tasks."android:apk"]
description = "The app's APK (x86_64 for the emulator, arm64-v8a for phones); needs a Lean runtime for Android (LEANRT)"
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; android/twin/build_apk.sh out/quiet.apk com.holmes.leanquiet 'Lean Quiet' Main x86_64 arm64-v8a"

[tasks."host:arrival"]
description = "A photo arriving chunk by chunk (QTests/Arrival): after each chunk the row's count, its pill's words and its painted ring are exact and the preview shows; a chunk twice changes nothing; the last one swaps in the file; a sender sees its own file from the outbox"
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build arrival && .lake/build/bin/arrival out/arrival"

[tasks.check]
description = "The proof gate: the app's theorems (Geometry: list content never under the header, composer or keyboard) on standard axioms only"
run = "tests/check.sh"

[tasks."host:two-nodes"]
description = "Two apps, each its own database, joined by link through their own pages: invite, paste, agree, the request carried, approve, admission carried, a message back"
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build two_nodes && .lake/build/bin/two_nodes out/two"

[tasks."ios:sim"]
description = "The app in the iOS Simulator on the Mac (take it with mac-turn first; ios/README.md): build, install, launch with the chaos data, a screenshot in out/ios-sim"
run = "ios/ship.sh sim"

[tasks."ios:sim-e2e"]
description = "End to end in the iOS Simulator: the UI test scrolls, taps, long-presses, types on the software keyboard and sends, each step checked in Lean's state over the control channel; screenshots in out/ios-sim/shots"
run = "ios/ship.sh e2e"

[tasks."ios:device"]
description = "The app built and signed for an iPhone on the Mac (installs nothing; ios/ship.sh run installs and launches)"
run = "ios/ship.sh device"

[tasks."ios:mdns"]
description = "The network probe in the iOS Simulator (ios/probe): Lean's TCP out and in, and lean-mdns both ways (the app logs the Mac's dns-sd -R probe; dns-sd -B and -L see the app's _leanquiet._udp announcement); report in out/ios-sim/probe-sim.txt"
run = "ios/ship.sh mdns"

[tasks."ios:mdns-device"]
description = "The network probe on the iPhone (DEVICE; ask before using it): as ios:mdns, over the Mac's Wi-Fi; report in out/ios-sim/probe-device.txt"
run = "ios/ship.sh mdns-device"

[tasks."ios:e2e"]
description = "End to end on the iPhone (DEVICE; ask before using it): build, install, launch, then over the Mac's Wi-Fi the chaos data, Lean's state and frames drawn; console in out/ios-device"
run = "ios/ship.sh e2e-device"

[tasks."android:scan-e2e"]
description = "Join with QR code on this suite's own emulator (lean-quiet-scan, emulator-5590): a real invite's code on the virtual scene's wall, scanned by the app's camera; it must land on Choose a name with exactly that link"
depends = ["android:apk"]
run = "android/test/scan_e2e.sh out/quiet.apk out/scan"

[tasks."host:net-join"]
description = "Two apps, each its own database and node (the engine's Runner with the Connection family), joined over real TCP on loopback by their own pages: invite, paste, agree, the request over TCP, approve, admission by sync, a post back"
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build net_join && .lake/build/bin/net_join out/net"

[tasks."host:cross"]
description = "Two apps over real TCP, two communities both named club, each app in both, everyone named Ann: every entry reachable by a tap, each home right, a second join to one community and Stop waiting on it"
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build cross && .lake/build/bin/cross out/cross"

[tasks."host:attach"]
description = "Photos over real TCP: two apps joined on loopback (as host:net-join), one photo each way through Add photos and send; the other side ends with every chunk, the file opened from them equal to the bytes sent, and its row drawn from the file"
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build attach && .lake/build/bin/attach out/attach"

[tasks."host:noto"]
description = "Lean Noto rasterization against fontTools, hostile fonts, metrics, fallback and cache; builds its executable"
run = "tests/noto.sh"
