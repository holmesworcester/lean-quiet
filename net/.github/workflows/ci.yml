name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: lean-net }
      # The model builds on lean-engine's net-admission branch, checked
      # out beside it (lakefile: ../lean-engine-net).
      - uses: actions/checkout@v4
        with: { repository: "${{ vars.ENGINE_REPO }}", ref: net-admission, path: lean-engine-net }
      - uses: jdx/mise-action@v2
        with: { working_directory: lean-net }
      - name: elan, sqlite, sodium
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "ELAN_HOME=$HOME/.elan" >> "$GITHUB_ENV"
          sudo apt-get update && sudo apt-get install -y libsqlite3-dev libsodium-dev
      - run: mise run check
        working-directory: lean-net
        env: { TMPDIR: /tmp }
