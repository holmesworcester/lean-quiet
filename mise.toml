# Named tasks, from the repository's top; ci/local.sh runs the gates
# (check, test:*, readme:links) the same way. mise asks once to trust this
# file (`mise trust`).
[env]
ELAN_HOME = "{{ env.ELAN_HOME | default(value='/mnt/storage/elan') }}"
TMPDIR = "{{ env.TMPDIR | default(value='/mnt/storage/holmes-tmp') }}"

# The gates

[tasks.check]
description = "The proof gate: every library builds, and every law of tests/Axioms.lean rests on standard axioms only"
run = "tests/check.sh"

[tasks."test:engine"]
description = "Scenario (Ed25519 + SQLite), SQLite-vs-model differential, purge and its on-disk erasure, kill -9 atomicity"
run = "tests/engine/run.sh"

[tasks."test:scale"]
description = "Scaling: a round's work at 1k, 10k and 100k items in one room against the proven bounds, with negative controls (tests/scale/run.sh)"
depends = ["crypto"]
run = "tests/scale/run.sh"

[tasks."test:fresh"]
description = "T-fresh: a fresh post's latency while N chunks sync (simulated time, against the old order), a peer that never reads over TCP, and the lanes' negative controls"
run = "tests/engine/fresh.sh"

[tasks."test:join-fair"]
description = "Production TCP/Noise/SQLite join under delay, sustained writes, backpressure and reconnect; reject strict-priority starvation"
depends = ["crypto"]
run = "bash tests/engine/join_fair.sh"

[tasks."test:fairness"]
description = "Real encrypted runner fairness regression and native handshake, round, closure and fair-execution certificates"
depends = ["test:join-fair"]
run = "bash tests/engine/fairness.sh"

[tasks."test:bootstrap-progress"]
description = "Bootstrap progress PR gate: native certificates, TCP retry/fairness and sync epoch/claim-tree mutation controls"
run = "mise run test:fairness && mise run test:simplify && mise run test:claim-tree && mise run test:catalog-retry && mise run test:reserved-retry && mise run test:retry-admission && mise run test:ingress && mise run test:native-lifetimes && mise run test:ref-publications && mise run test:writer-fairness && mise run test:expiry-grace && mise run test:close-ingress && mise run test:runner-ownership && mise run test:demand-rank"

[tasks."test:catalog-retry"]
description = "Actual Node/SQLite durable retry under dropped control/data traffic and continuing writes, including a no-retry mutation"
depends = ["crypto"]
run = "bash tests/engine/catalog_retry.sh"

[tasks."test:close-ingress"]
description = "Real TCP/Noise admitted notice survives transport close/reap; frozen source and immediate retirement controls"
depends = ["crypto"]
run = "bash tests/engine/close_ingress.sh"

[tasks."test:sync-full"]
description = "Negative control: with Sqlite.lean back at synchronous NORMAL, sqlite_build's durability check fails"
depends = ["crypto"]
run = "bash tests/engine/sync_full.sh"

[tasks."test:expiry-grace"]
description = "Actual admitted TCP/Noise/SQLite input survives silence expiry under UI priority; junk cannot rearm grace and authenticated removal erases keys"
depends = ["crypto"]
run = "bash tests/engine/expiry_grace.sh"

[tasks."test:writer-fairness"]
description = "Actual writer loop FIFO/local-priority fairness with SQLite, reused kernel service bounds and four compiling starvation/copy controls"
depends = ["crypto"]
run = "bash tests/engine/writer_fairness.sh"

[tasks."test:reader-claim"]
description = "Actual Reader/SQLite transaction failure retains queued actions and notices; five compiling loss/cancellation controls"
depends = ["crypto"]
run = "bash tests/engine/reader_claim.sh"

[tasks."test:reader-prune"]
description = "Actual reader rollback and SQLite journal pruning retain the notice needed by a healthy retry; compiling early-ack control"
depends = ["crypto"]
run = "bash tests/engine/reader_prune.sh"

[tasks."test:ref-publications"]
description = "Actual checkpoint, writer resume and reader/prune publications under forced SDK overlap"
depends = ["crypto"]
run = "bash tests/engine/ref_publications.sh"

[tasks."test:native-lifetimes"]
description = "Real connect/reader lifetime checks and deterministic SDK stop overlap; nine compiling controls"
depends = ["crypto"]
run = "bash tests/engine/native_lifetime.sh"

[tasks."test:ingress"]
description = "Real per-peer TCP mailbox bounds, UI priority, quota reuse and cancellation; reject eight compiling mutations"
depends = ["crypto"]
run = "bash tests/engine/ingress.sh"

[tasks."test:retry-admission"]
description = "Actual Node/SQLite/TCP multiplex retry service, authenticated reachability, continuing arrivals and six strict controls"
depends = ["crypto"]
run = "bash tests/engine/retry_admission.sh"

[tasks."test:reserved-retry"]
description = "Real Runner/TCP retry under zero ordinary window, oversized hot batches and continuing posts; delayed cursor and transport mutations"
depends = ["crypto"]
run = "bash tests/engine/reserved_retry.sh"

[tasks.bench]
description = "Wall times of the byte codec on a photo's paths: a 64 KiB chunk op's encode, decode and validation, 100 chunks into SQLite, a 48 KiB frame bundle"
run = "(cd engine/native/crypto && CARGO_TARGET_DIR=\"$PWD/target\" cargo build --release --quiet) && lake build bench && mkdir -p out && .lake/build/bin/bench out/bench"

[tasks."test:engine-runtime"]
description = "Build Lean/Init/Std from source with phone options for x86_64 Linux, then run the engine suites; needs local LEAN_SRC 4.35.0 and UV_SRC 1.51.0"
run = "tests/engine/run.sh --phone-runtime"

[tasks."test:app"]
description = "The native C twin and the app sessions: host:twin-demo, host:app, host:two-nodes, host:link-devices, host:net-join, host:net-link, host:cross, host:arrival, host:attach and host:ux"
run = "tests/app/run.sh"

[tasks."host:component-demand"]
description = "Build and test owned query lifetimes, cancellation races, fair work rotation, actual attachment components and scrolling with an occupied pool"
depends = ["crypto"]
run = "bash tests/app/demand.sh"

[tasks."host:component-demand-negative"]
description = "Reject stale publication, obsolete work, wrong priority and missing child-query declarations in scratch copies"
depends = ["host:component-demand"]
run = "python3 tests/app/demand_negative.py"

[tasks."test:shipped"]
description = "Build and check the SQLite configuration and native C twin; kill system-SQLite, wrong-threading and broken-keyboard mutants"
depends = ["crypto"]
run = "tests/shipped/check.sh engine && tests/shipped/check.sh app"

[tasks."test:qr"]
description = "QR's deterministic gate: escape-hatch scan, codec and frame suite, camera frames, cross-checks with qrencode/zbarimg/segno/qrcodegen, negative controls"
run = "tests/qr/check.sh"

[tasks."test:mdns"]
description = "mDNS's deterministic gate: escape-hatch scan, real/hostile/fuzzed packets, negative controls"
run = "tests/mdns/check.sh"

[tasks."test:net"]
description = "The bootstrap model: its laws built, the scene on the real engine, negative controls"
run = "tests/net/check.sh"

[tasks."readme:links"]
description = "The README's theorem links, and its laws not yet about running code (tests/Wiring.lean), match the code (ci/proof-links.py; needs the tree built); the proof tree (docs/PROOF-TREE.md) is drawn from that run's graph (ci/proof-tree.py, its tests first)"
run = "python3 tests/proof_tree_test.py && python3 ci/proof-links.py --check && python3 ci/proof-tree.py --check --graph out/proof-graph.json"

[tasks."hackathon:refresh"]
description = "Just before the Vibecheck submission, at main's head: write docs/HACKATHON.md's generated numbers from git (ci/hackathon.py), commit that file alone, then run the self-test and the check"
run = "python3 ci/hackathon.py --refresh"

[tasks."hackathon:check"]
description = "ci/hackathon.py's self-test (the base reads 787 of 1016 laws and 20 controls; malformed lead lines, a stale block and an edited number are refused), then docs/HACKATHON.md's block is current for HEAD: nothing but that file changed since the commit it names. Not in the per-push gate: every landing makes the block stale"
run = "python3 ci/hackathon.py --self-test && python3 ci/hackathon.py --check"

[tasks."hackathon:test"]
description = "ci/hackathon.py's self-test alone: git only, a few seconds"
run = "python3 ci/hackathon.py --self-test"

[tasks."forensics:check"]
description = "The proofslop forensics tool's deterministic pass (for-all-dev/forensics, pinned, with ci/forensics-local.patch): build, extract, lint, duplicates; fail on a nonstandard axiom, sorry, native_decide, a kernel escape hatch, or a statement smell outside ci/forensics-baseline.txt (degenerate witnesses, unused or contradictory hypotheses, trivial conclusions). Needs bun. Output: out/forensics/model.json"
depends = ["crypto"]
run = "bash ci/forensics.sh"

[tasks."forensics:judge"]
description = "The nightly forensics judge: a small seeded Sonnet sample of vacuity-and-misstatement and unnecessary-hypotheses over the deterministic dump, per-call budget caps (about $1 a night), rates appended to /mnt/storage/holmes-tmp/forensics-nightly/history.tsv. Run nightly by ci/nightly.sh after the release run"
run = "bash ci/forensics-judge.sh"

[tasks."premises:check"]
description = "Every cited law's premises tagged ([discharged]/[env]/[crypto]/[base]/[trusted]/[model]), the README's ✅/🟡 as they allow, every assumption with both sides or in the shrinking baseline (ci/premises.py; needs the tree built)"
run = "python3 ci/premises.py --check"

[tasks."layout:check"]
description = "The op tree's layout (ci/layout.py): eight file names under app/, an op is a folder with its validator, each family registers its ops, imports go down the tree (or to cited op types), and the engine imports no app module; then its negative controls"
run = "python3 ci/layout.py --self-test"

[tasks."reorg:test"]
description = "The reorg's import rewriter (ci/reorg-imports.py) on a copy of every Lean file of f1bfd62: each gets its new path's imports"
run = "python3 ci/reorg-imports.py --self-test"

[tasks.ci]
description = "The gate before every push to main: the proofs, then the fast deterministic tests at once; logs in out/ci (ci/local.sh)"
run = "ci/local.sh"

[tasks.crypto]
description = "The engine's Rust crypto (engine/native/crypto), which every executable links"
run = "cd engine/native/crypto && CARGO_TARGET_DIR=\"$PWD/target\" cargo build --release --quiet"

# The app on the headless twin

[tasks."nav:negative"]
description = "Navigation's negative controls: each mutant of Nav or of App's steps over it (back at a root, a page pushed twice, a draft cleared, a switch that keeps the stack) fails its law"
run = "tests/app/nav_negative.sh"

[tasks."host:hover-proofs"]
description = "Compile mutations of the actual hover core in isolated directories; its unchanged Lean proofs must reject each one"
run = "python3 tests/app/hover_proofs.py"

[tasks."host:desktop"]
description = "The real desktop driver: hover pixels/actions/lifetimes, proof audit and negative controls, boundary renders, switching, settings and resize"
depends = ["crypto"]
run = "tests/app/desktop.sh"

[tasks."test:clumps"]
description = "Build and test sender-owned clumps: real signatures, SQLite, child/root queries, arrival order and legacy index migration"
depends = ["crypto"]
run = "lake build clumps clump_lists && .lake/build/bin/clumps out/clumps && .lake/build/bin/clump_lists out/clump-lists"

[tasks."host:photo"]
description = "Build and test native photo handoff under sanitizers, then drive composer ownership, cancellation, backgrounding and signed attachment sends"
depends = ["crypto"]
run = "platforms/native/photo_test.sh && tools/noto_assets.sh && lake build photo && .lake/build/bin/photo out/photo/app"

[tasks."visual:compare"]
description = "Build the real Lean renderer; compare all pixels against pinned libquiet screens; retain heatmaps and overlays"
run = "tests/visual/run.sh"

[tasks."visual:hover"]
description = "Build native hover pixels; compare paired states against real libquiet DOM targets and reject missing/incorrect hover"
run = "tests/visual/hover.sh"

[tasks."visual:composer"]
description = "Build the actual composer; compare its field, toolbar and pixels with libquiet at mobile/desktop widths and zoom"
run = "tests/visual/composer.sh"

[tasks."visual:reference"]
description = "Explicitly regenerate libquiet references from a pinned git archive using its real App.svelte and bundled fonts"
run = "tests/visual/reference.sh"

[tasks."linux:build"]
description = "The Linux desktop (platforms/linux): Lean's pixels through xcb and MIT-SHM"
run = "platforms/linux/build.sh"

[tasks."linux:input"]
description = "The Linux shell's native editor and RGB conversion, under ASan and UBSan"
run = "platforms/linux/input_test.sh"

[tasks."linux:e2e"]
description = "The Linux desktop under Xvfb at scale 1 and 2 and without MIT-SHM: OS hover/cursors/focus, resize, switching, editing, clipboard and screenshots (needs local X sockets)"
run = "platforms/linux/test.sh"

[tasks."linux:links"]
description = "leanquiet:// links on the Linux desktop under Xvfb, through install.sh's launcher and menu entry in private XDG folders: a cold start's argument, warm xdg-open and second launches handed to the running instance (raised, no second process), other databases' and stale sockets (needs local X sockets, xdg-utils)"
run = "platforms/linux/links.sh"

[tasks."linux:links-negative"]
description = "The links e2e's negative controls: the old empty lq_links, one socket for every database, a window never raised; each must fail linux:links"
run = "python3 platforms/linux/negative_links.py"

[tasks."make:assets-test"]
description = "make install's assets step on made-up tarballs (file://): download, sha256 and per-file checks, repair, deterministic packing; controls: a flipped bit, files not matching the list, plain http, an unreachable URL, a stale pin and changed asset scripts must each fail. No network"
run = "tests/make/assets_test.sh"

[tasks."make:verify-test"]
description = "make verify: refused with its reason on this repository while it builds with Lean below 4.35; on a small Lean 4.35 project made here, lake check and lake comparator pass, and a solution proving a different statement, one resting on a new axiom, and a missing comparator.json each fail. Needs the Lean 4.35.0 toolchain and bubblewrap"
run = "tests/make/verify_test.sh"

[tasks."make:clean-room"]
description = "make install && make run from a git clone of HEAD in fresh ubuntu:24.04, ubuntu:22.04 and debian:12 containers, as a user with sudo: missing packages, elan, rustup, the pinned assets tarball (packed here, served by file://), the cold build (timed), a second install that redoes nothing, and screenshots of make run and make online under Xvfb (an empty screen must fail), then make demo's e2e from the clone (tests/make/demo_e2e.py). Needs Docker and network; see tests/make/clean_room.sh"
run = "tests/make/clean_room.sh"

[tasks."make:demo-e2e"]
description = "make demo under Xvfb (1920x1080), as a judge runs it: Alice's laptop and Bob's side by side, the join done by X input (Bob's name, Agree & Join; Waiting to join and Approve in Alice's window), Alice's message on Bob's screen (his QUIET_STATE, and his conversation's pixels against Alice's), Bob's reply on Alice's, both windows closed and make demo exiting 0; then make demo ARGS=--auto. Needs Xvfb, xdotool, ImageMagick, PIL; screenshots in out/make/demo-e2e"
depends = ["linux:build"]
run = "python3 tests/make/demo_e2e.py"

[tasks."make:demo-negative"]
description = "The make demo e2e's negative control: once Bob is in, his app restarts with --offline; Alice's message must then fail both checks that it reached him (state and screen), and nothing before them"
depends = ["linux:build"]
run = "tests/make/demo_negative.sh"

[tasks."host:desktop-negative"]
description = "The desktop's negative controls: eight layout and control laws broken, two native functions, five UI behaviours (the resize settle among them), two X11 resize mechanisms (gravity, the sync request) and five Get started/shell mutants; each must fail"
run = "python3 platforms/linux/negative.py && python3 platforms/linux/negative_ui.py && python3 platforms/linux/negative_x11.py && python3 tests/app/start_negative.py"

[tasks."host:twin-demo"]
description = "The twin demo on the headless twin: the seam's effects from a script, checked by replies and dumped screens"
depends = ["crypto"]
run = "tests/app/host_twin_demo.sh"

[tasks."host:app"]
description = "The app's own session without a window (platforms/headless/Host): chaos, cold open, a fling to the top with unpainted-row counts, send and react with the writer paused (pending, then stored); screenshots in out/host"
depends = ["crypto"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build host && .lake/build/bin/host ${MESSAGES:-500} out/host"

[tasks."host:two-nodes"]
description = "Two apps, each its own database, joined by link through their own pages: invite, paste, agree, the request carried, approve, admission carried, a message back"
depends = ["crypto"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build two_nodes && .lake/build/bin/two_nodes out/two"

[tasks."host:link-devices"]
description = "Linked devices, four apps by memory transport: a device link shown and scanned, pasted on Get started's Link devices, approved only by the issuer's user, admitted into it with no profile of its own; posts both ways; removing a user cuts both of its devices"
depends = ["crypto"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build link_devices && .lake/build/bin/link_devices out/link"

[tasks."host:net-link"]
description = "Linked devices over TCP on loopback, four apps each with its own node: link, approve, sync both ways, only the issuer's user asked, removal cuts (a sibling-only linked device: GAP until the pre-admission rooms land; --strict fails it)"
depends = ["crypto"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build net_link && .lake/build/bin/net_link out/net-link"

[tasks."host:net-join"]
description = "Two actual apps join through their pages over TCP, then commit, read back and paint local writes during sustained incoming sync"
depends = ["crypto"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build net_join && .lake/build/bin/net_join out/net"

[tasks."host:notify"]
description = "Notifications on the headless twin: two apps joined by link; cards, quiet, levels, links, Sync in the background, removal, and libquiet's 20,736 reference-policy cases (docs/NOTIFICATIONS.md)"
depends = ["crypto"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build notify && .lake/build/bin/notify out/notify"

[tasks."host:notify-negative"]
description = "Notifications' negative controls in a snapshot: ten runtime mutants fail their checks, eight proof mutants break their laws"
depends = ["crypto"]
run = "python3 tests/app/notify_negative.py"

[tasks."host:notify-oracle"]
description = "Regenerate tests/app/notify-policy.txt from libquiet's own policy.rs (local clone, rustc, no network)"
run = "python3 tests/app/notify_oracle.py"

[tasks."host:write-admission"]
description = "Actual app Send rejects unframable posts and exhausted pending queues, preserves drafts, and commits after capacity clears"
depends = ["crypto"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build write_admission && .lake/build/bin/write_admission out/write-admission && python3 tests/app/write_admission_negative.py"

[tasks."host:cross"]
description = "Two apps over real TCP, two communities both named club, each app in both, everyone named Ann: every entry reachable by a tap, each home right, a second join to one community and Stop waiting on it"
depends = ["crypto"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build cross && if [ \"${SKIP_TCP:-0}\" = 1 ]; then echo 'SKIP cross (TCP sandbox; built)'; else .lake/build/bin/cross out/cross; fi"

[tasks."host:arrival"]
description = "A photo arriving chunk by chunk (platforms/headless/Arrival): after each chunk the row's count, its pill's words and its painted ring are exact and the preview shows; a chunk twice changes nothing; the last one swaps in the file; a sender sees its own file from the outbox"
depends = ["crypto"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build arrival && .lake/build/bin/arrival out/arrival"

[tasks."host:attach"]
description = "Photos over real TCP: two apps joined on loopback (as host:net-join), one photo each way through Add photos and send; the other side ends with every chunk, the file opened from them equal to the bytes sent, and its row drawn from the file"
depends = ["crypto"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build attach && if [ \"${SKIP_TCP:-0}\" = 1 ]; then echo 'SKIP attach (TCP sandbox; built)'; else .lake/build/bin/attach out/attach; fi"

[tasks."host:ux"]
description = "Dogfood UX on the headless twin (platforms/headless/Ux), on both scroll seams (shifts clamped at once, as the C twin; queued to the frame, as native vsync): arrivals keep the row being read still, a burst larger than the reader's window too; full labels by long press, paged and copied exactly; no session dots on home's avatars; photo reactions, Copy, switching; then its negative controls (tests/app/ux_negative.sh)"
depends = ["crypto"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; lake build ux && .lake/build/bin/ux out/ux && .lake/build/bin/ux out/ux-queued queued && tests/app/ux_negative.sh"

# Android (platforms/android)

[tasks."android:apk"]
description = "The app's APK (x86_64 for the emulator, arm64-v8a for phones); needs a Lean runtime for Android (LEANRT)"
depends = ["android:runtime"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; platforms/android/twin/build_apk.sh out/quiet.apk com.holmes.leanquiet 'Lean Quiet' Main x86_64 arm64-v8a"

[tasks."android:photo-e2e"]
description = "Build/setup a private Android emulator; drive system photo picker cancellation, EXIF-oriented bounded selection and attachment send"
depends = ["android:apk"]
run = "platforms/android/test/photo_e2e.sh"

[tasks."android:photo-lifecycle-e2e"]
description = "Build/setup owned Android; actual picker/decoder recreation cancellation and stale owner controls against Main and SQLite"
run = "bash platforms/android/test/photo_lifecycle/run.sh"

[tasks."android:scan-e2e"]
description = "Join with QR code on this suite's own emulator (lean-quiet-scan, emulator-5590): a real invite's code on the virtual scene's wall, scanned by the app's camera; it must land on Choose a name with exactly that link"
depends = ["android:apk"]
run = "platforms/android/test/scan_e2e.sh out/quiet.apk out/scan"

[tasks."android:twin-demo-apk"]
description = "The twin demo's APK (x86_64 for the emulator, arm64-v8a for phones); needs a Lean runtime for Android (LEANRT)"
depends = ["android:runtime"]
run = "platforms/android/twin/build_apk.sh out/twin-demo.apk com.holmes.leanquiet 'Lean Quiet' platforms.headless.TwinDemo x86_64 arm64-v8a"

[tasks."android:twin-demo-e2e"]
description = "Build the runtime and APK, then test a provisioned x86_64 emulator (SERIAL, default emulator-5644): keyboard, insets, scrolling, taps, control socket; retains failure artifacts"
run = "tests/app/mobile.sh android"

[tasks."android:lifecycle-e2e"]
description = "Build/setup an owned API36 emulator; actual Activity recreation, stale JNI callbacks, IME startup/focus/hide and clean process finish, with eight compiling controls"
run = "bash platforms/android/test/lifecycle/run.sh"

[tasks."android:runtime"]
description = "Lean's runtime, Init and libuv cross-built for Android into out/leanrt (needs LEAN_SRC at v4.35.0 and UV_SRC at v1.51.0)"
run = "platforms/android/leanrt/build.sh \"${LEAN_SRC:-/mnt/storage/holmes-wt/lean-src-435/lean4}\" \"${UV_SRC:-/mnt/storage/holmes-wt/lean-src-435/libuv}\" \"$PWD/out/leanrt\" x86_64 arm64-v8a"

[tasks."android:qr-apk"]
description = "The QR camera harness's APK (x86_64 for the emulator, arm64-v8a for phones)"
depends = ["crypto"]
run = "[ -f out/leanrt/x86_64/libInit.a ] || mise run android:runtime; \"$ELAN_HOME/bin/lake\" build qr_tool && platforms/android/qr/app/build_apk.sh out/leanqr.apk x86_64 arm64-v8a"

[tasks."android:qr-e2e"]
description = "On the QR harness's own emulator AVD (created if missing): Lean decodes the invite from the virtual-scene camera, then pictures from the system Photo Picker and the system camera reach Lean and are stored as QOI; logcat, screenshots and the stored pictures in out/qr-e2e"
depends = ["android:qr-apk"]
run = "platforms/android/qr/test/e2e.sh out/leanqr.apk out/qr-e2e"

# iOS (platforms/ios), on the Mac

[tasks."ios:sim"]
description = "The app in the iOS Simulator on the Mac (take it with mac-turn first; platforms/ios/README.md): build, install, launch with the chaos data, a screenshot in out/ios-sim"
run = "platforms/ios/ship.sh sim"

[tasks."ios:sim-e2e"]
description = "Build and run in the iOS Simulator: scroll, tap, long-press, type and send, checked in Lean's state; logs, screenshots and xcresult in out/ios-sim even on failure"
run = "tests/app/mobile.sh ios"

[tasks."ios:photo-e2e"]
description = "Build/setup the private iOS simulator via MAC; seed Photos and run native picker cancellation, oriented bounded decode and send"
run = "PHOTO_ONLY=1 platforms/ios/ship.sh e2e"

[tasks."ios:device"]
description = "The app built and signed for an iPhone on the Mac (installs nothing; platforms/ios/ship.sh run installs and launches)"
run = "platforms/ios/ship.sh device"

[tasks."ios:mdns"]
description = "The network probe in the iOS Simulator (platforms/ios/probe): Lean's TCP out and in, and lean-mdns both ways (the app logs the Mac's dns-sd -R probe; dns-sd -B and -L see the app's _leanquiet._udp announcement); report in out/ios-sim/probe-sim.txt"
run = "platforms/ios/ship.sh mdns"

[tasks."ios:mdns-device"]
description = "The network probe on the iPhone (DEVICE; ask before using it): as ios:mdns, over the Mac's Wi-Fi; report in out/ios-sim/probe-device.txt"
run = "platforms/ios/ship.sh mdns-device"

[tasks."ios:e2e"]
description = "End to end on the iPhone (DEVICE; ask before using it): build, install, launch, then over the Mac's Wi-Fi the chaos data, Lean's state and frames drawn; console in out/ios-device"
run = "platforms/ios/ship.sh e2e-device"

