# Each part keeps its own tasks (engine/, app/, qr/, mdns/, net/mise.toml);
# these run them from the top. mise asks once to trust each config file
# (`mise trust` in the directory).
[tasks."engine:check"]
run = "cd engine && mise run check"
[tasks."engine:test"]
run = "cd engine && mise run test"
[tasks."app:check"]
run = "cd app && mise run check && mise run host:app && mise run host:two-nodes && mise run host:net-join && mise run host:cross && mise run host:arrival && mise run host:attach && mise run host:ux"
[tasks."qr:check"]
run = "cd qr && mise run check"
[tasks."mdns:check"]
run = "cd mdns && mise run check"
[tasks."net:check"]
run = "cd net && mise run check"
[tasks."readme:links"]
description = "The README's theorem links match the code (ci/proof-links.py; needs the parts built)"
run = "python3 ci/proof-links.py --check"
[tasks.check]
description = "Every gated part, then the README's links"
depends = ["engine:check", "engine:test", "app:check", "qr:check", "mdns:check", "net:check"]
run = "python3 ci/proof-links.py --check"

[tasks.ci]
description = "Local CI: every part's gate, logs in out/ci (ci/local.sh)"
run = "ci/local.sh"
