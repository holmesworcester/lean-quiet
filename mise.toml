# Named tasks, from the repository's top; ci/local.sh runs the gates
# (check, test:*, readme:links) the same way. mise asks once to trust this
# file (`mise trust`).
[env]
ELAN_HOME = "{{ env.ELAN_HOME | default(value='/mnt/storage/elan') }}"
TMPDIR = "{{ env.TMPDIR | default(value='/mnt/storage/holmes-tmp') }}"

# The gates

[tasks.check]
description = "The proof gate: every library builds, and every law of tests/Axioms.lean rests on standard axioms only"
run = "tests/check.sh"

[tasks."test:engine"]
description = "Scenario (Ed25519 + SQLite), SQLite-vs-model differential, purge and its on-disk erasure, kill -9 atomicity"
run = "tests/engine/run.sh"

[tasks."test:fresh"]
description = "T-fresh: a fresh post's latency while N chunks sync (simulated time, against the old order), a peer that never reads over TCP, and the lanes' negative controls"
run = "tests/engine/fresh.sh"

[tasks."test:join-fair"]
description = "Production TCP/Noise/SQLite join under delay, sustained writes, backpressure and reconnect; reject strict-priority starvation"
depends = ["crypto"]
run = "bash tests/engine/join_fair.sh"

[tasks."test:fairness"]
description = "Real encrypted runner fairness regression, production-bootstrap certificates and the explicit fair model execution"
depends = ["test:join-fair"]
run = "bash tests/engine/fairness.sh"

[tasks.bench]
description = "Wall times of the byte codec on a photo's paths: a 64 KiB chunk op's encode, decode and validation, 100 chunks into SQLite, a 48 KiB frame bundle"
run = "(cd engine/native/crypto && CARGO_TARGET_DIR=\"$PWD/target\" cargo build --release --quiet) && lake build bench && mkdir -p out && .lake/build/bin/bench out/bench"

[tasks."test:engine-runtime"]
description = "Build Lean/Init/Std from source with phone options for x86_64 Linux, then run the engine suites; needs local LEAN_SRC 4.34.0 and UV_SRC 1.51.0"
run = "tests/engine/run.sh --phone-runtime"

[tasks."test:app"]
description = "The native C twin and the app sessions: host:twin-demo, host:app, host:two-nodes, host:net-join, host:cross, host:arrival, host:attach and host:ux"
run = "tests/app/run.sh"

[tasks."host:component-demand"]
description = "Build and test owned query lifetimes, cancellation races, fair work rotation, actual attachment components and scrolling with an occupied pool"
depends = ["crypto"]
run = "bash tests/app/demand.sh"

[tasks."host:component-demand-negative"]
description = "Reject stale publication, obsolete work, wrong priority and missing child-query declarations in scratch copies"
depends = ["host:component-demand"]
run = "python3 tests/app/demand_negative.py"

[tasks."test:shipped"]
description = "Build and check the SQLite configuration and native C twin; kill system-SQLite, wrong-threading and broken-keyboard mutants"
depends = ["crypto"]
run = "tests/shipped/check.sh engine && tests/shipped/check.sh app"

[tasks."test:qr"]
description = "QR's deterministic gate: escape-hatch scan, codec and frame suite, camera frames, cross-checks with qrencode/zbarimg/segno/qrcodegen, negative controls"
run = "tests/qr/check.sh"

[tasks."test:mdns"]
description = "mDNS's deterministic gate: escape-hatch scan, real/hostile/fuzzed packets, negative controls"
run = "tests/mdns/check.sh"

[tasks."test:net"]
description = "The bootstrap model: its laws built, the scene on the real engine, negative controls"
run = "tests/net/check.sh"

[tasks."readme:links"]
description = "The README's theorem links, and its laws not yet about running code (tests/Wiring.lean), match the code (ci/proof-links.py; needs the tree built)"
run = "python3 ci/proof-links.py --check"

[tasks."layout:check"]
description = "The op tree's layout (ci/layout.py): eight file names under app/, an op is a folder with its validator, each family registers its ops, imports go down the tree (or to cited op types), and the engine imports no app module; then its negative controls"
run = "python3 ci/layout.py --self-test"

[tasks."reorg:test"]
description = "The reorg's import rewriter (ci/reorg-imports.py) on a copy of every Lean file of f1bfd62: each gets its new path's imports"
run = "python3 ci/reorg-imports.py --self-test"

[tasks.ci]
description = "Local CI: every gate, logs in out/ci (ci/local.sh)"
run = "ci/local.sh"

[tasks.crypto]
description = "The engine's Rust crypto (engine/native/crypto), which every executable links"
run = "cd engine/native/crypto && CARGO_TARGET_DIR=\"$PWD/target\" cargo build --release --quiet"

# The app on the headless twin

[tasks."nav:negative"]
description = "Navigation's negative controls: each mutant of Nav or of App's steps over it (back at a root, a page pushed twice, a draft cleared, a switch that keeps the stack) fails its law"
run = "tests/app/nav_negative.sh"

[tasks."host:hover-proofs"]
description = "Compile mutations of the actual hover core in isolated directories; its unchanged Lean proofs must reject each one"
run = "python3 tests/app/hover_proofs.py"

[tasks."host:desktop"]
description = "The real desktop driver: hover pixels/actions/lifetimes, proof audit and negative controls, boundary renders, switching, settings and resize"
depends = ["crypto"]
run = "tests/app/desktop.sh"

[tasks."test:clumps"]
description = "Build and test sender-owned clumps: real signatures, SQLite, child/root queries, arrival order and legacy index migration"
depends = ["crypto"]
run = "lake build clumps clump_lists && .lake/build/bin/clumps out/clumps && .lake/build/bin/clump_lists out/clump-lists"

[tasks."host:photo"]
description = "Build and test native photo handoff under sanitizers, then drive composer ownership, cancellation, backgrounding and signed attachment sends"
depends = ["crypto"]
run = "platforms/native/photo_test.sh && tools/noto_assets.sh && lake build photo && .lake/build/bin/photo out/photo/app"

[tasks."visual:compare"]
description = "Build the real Lean renderer; compare all pixels against pinned libquiet screens; retain heatmaps and overlays"
run = "tests/visual/run.sh"

[tasks."visual:hover"]
description = "Build native hover pixels; compare paired states against real libquiet DOM targets and reject missing/incorrect hover"
run = "tests/visual/hover.sh"

[tasks."visual:composer"]
description = "Build the actual composer; compare its field, toolbar and pixels with libquiet at mobile/desktop widths and zoom"
run = "tests/visual/composer.sh"

[tasks."visual:reference"]
description = "Explicitly regenerate libquiet references from a pinned git archive using its real App.svelte and bundled fonts"
run = "tests/visual/reference.sh"

[tasks."linux:build"]
description = "The Linux desktop (platforms/linux): Lean's pixels through xcb and MIT-SHM"
run = "platforms/linux/build.sh"

[tasks."linux:input"]
description = "The Linux shell's native editor and RGB conversion, under ASan and UBSan"
run = "platforms/linux/input_test.sh"

[tasks."linux:e2e"]
description = "The Linux desktop under Xvfb at scale 1 and 2 and without MIT-SHM: OS hover/cursors/focus, resize, switching, editing, clipboard and screenshots (needs local X sockets)"
run = "platforms/linux/test.sh"

[tasks."linux:links"]
description = "leanquiet:// links on the Linux desktop under Xvfb, through install.sh's launcher and menu entry in private XDG folders: a cold start's argument, warm xdg-open and second launches handed to the running instance (raised, no second process), other databases' and stale sockets (needs local X sockets, xdg-utils)"
run = "platforms/linux/links.sh"

[tasks."linux:links-negative"]
description = "The links e2e's negative controls: the old empty lq_links, one socket for every database, a window never raised; each must fail linux:links"
run = "python3 platforms/linux/negative_links.py"

[tasks."host:desktop-negative"]
description = "The desktop's negative controls: eight layout and control laws broken, two native functions, five UI behaviours (the resize settle among them) and two X11 resize mechanisms (gravity, the sync request); each must fail"
run = "python3 platforms/linux/negative.py && python3 platforms/linux/negative_ui.py && python3 platforms/linux/negative_x11.py"

[tasks."host:twin-demo"]
description = "The twin demo on the headless twin: the seam's effects from a script, checked by replies and dumped screens"
depends = ["crypto"]
run = "tests/app/host_twin_demo.sh"

[tasks."host:app"]
description = "The app's own session without a window (platforms/headless/Host): chaos, cold open, a fling to the top with unpainted-row counts, send and react with the writer paused (pending, then stored); screenshots in out/host"
depends = ["crypto"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build host && .lake/build/bin/host ${MESSAGES:-500} out/host"

[tasks."host:two-nodes"]
description = "Two apps, each its own database, joined by link through their own pages: invite, paste, agree, the request carried, approve, admission carried, a message back"
depends = ["crypto"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build two_nodes && .lake/build/bin/two_nodes out/two"

[tasks."host:net-join"]
description = "Two apps, each its own database and node (the engine's Runner with the Connection family), joined over real TCP on loopback by their own pages: invite, paste, agree, the request over TCP, approve, admission by sync, a post back"
depends = ["crypto"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build net_join && .lake/build/bin/net_join out/net"

[tasks."host:cross"]
description = "Two apps over real TCP, two communities both named club, each app in both, everyone named Ann: every entry reachable by a tap, each home right, a second join to one community and Stop waiting on it"
depends = ["crypto"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build cross && if [ \"${SKIP_TCP:-0}\" = 1 ]; then echo 'SKIP cross (TCP sandbox; built)'; else .lake/build/bin/cross out/cross; fi"

[tasks."host:arrival"]
description = "A photo arriving chunk by chunk (platforms/headless/Arrival): after each chunk the row's count, its pill's words and its painted ring are exact and the preview shows; a chunk twice changes nothing; the last one swaps in the file; a sender sees its own file from the outbox"
depends = ["crypto"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build arrival && .lake/build/bin/arrival out/arrival"

[tasks."host:attach"]
description = "Photos over real TCP: two apps joined on loopback (as host:net-join), one photo each way through Add photos and send; the other side ends with every chunk, the file opened from them equal to the bytes sent, and its row drawn from the file"
depends = ["crypto"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; tools/noto_assets.sh; lake build attach && if [ \"${SKIP_TCP:-0}\" = 1 ]; then echo 'SKIP attach (TCP sandbox; built)'; else .lake/build/bin/attach out/attach; fi"

[tasks."host:ux"]
description = "Dogfood UX on the headless twin (platforms/headless/Ux), on both scroll seams (shifts clamped at once, as the C twin; queued to the frame, as native vsync): arrivals keep the row being read still, a burst larger than the reader's window too; full labels by long press, paged and copied exactly; no session dots on home's avatars; photo reactions, Copy, switching; then its negative controls (tests/app/ux_negative.sh)"
depends = ["crypto"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; lake build ux && .lake/build/bin/ux out/ux && .lake/build/bin/ux out/ux-queued queued && tests/app/ux_negative.sh"

# Android (platforms/android)

[tasks."android:apk"]
description = "The app's APK (x86_64 for the emulator, arm64-v8a for phones); needs a Lean runtime for Android (LEANRT)"
depends = ["android:runtime"]
run = "[ -f assets/font.bin ] || tools/fetch_assets.sh; platforms/android/twin/build_apk.sh out/quiet.apk com.holmes.leanquiet 'Lean Quiet' Main x86_64 arm64-v8a"

[tasks."android:photo-e2e"]
description = "Build/setup a private Android emulator; drive system photo picker cancellation, EXIF-oriented bounded selection and attachment send"
depends = ["android:apk"]
run = "platforms/android/test/photo_e2e.sh"

[tasks."android:scan-e2e"]
description = "Join with QR code on this suite's own emulator (lean-quiet-scan, emulator-5590): a real invite's code on the virtual scene's wall, scanned by the app's camera; it must land on Choose a name with exactly that link"
depends = ["android:apk"]
run = "platforms/android/test/scan_e2e.sh out/quiet.apk out/scan"

[tasks."android:twin-demo-apk"]
description = "The twin demo's APK (x86_64 for the emulator, arm64-v8a for phones); needs a Lean runtime for Android (LEANRT)"
depends = ["android:runtime"]
run = "platforms/android/twin/build_apk.sh out/twin-demo.apk com.holmes.leanquiet 'Lean Quiet' platforms.headless.TwinDemo x86_64 arm64-v8a"

[tasks."android:twin-demo-e2e"]
description = "Build the runtime and APK, then test a provisioned x86_64 emulator (SERIAL, default emulator-5644): keyboard, insets, scrolling, taps, control socket; retains failure artifacts"
run = "tests/app/mobile.sh android"

[tasks."android:runtime"]
description = "Lean's runtime, Init and libuv cross-built for Android into out/leanrt (needs LEAN_SRC at v4.34.0 and UV_SRC at v1.51.0)"
run = "platforms/android/leanrt/build.sh \"${LEAN_SRC:-/mnt/storage/holmes-wt/lean-src/lean4}\" \"${UV_SRC:-/mnt/storage/holmes-wt/lean-src/libuv}\" \"$PWD/out/leanrt\" x86_64 arm64-v8a"

[tasks."android:qr-apk"]
description = "The QR camera harness's APK (x86_64 for the emulator, arm64-v8a for phones)"
depends = ["crypto"]
run = "[ -f out/leanrt/x86_64/libInit.a ] || mise run android:runtime; \"$ELAN_HOME/bin/lake\" build qr_tool && platforms/android/qr/app/build_apk.sh out/leanqr.apk x86_64 arm64-v8a"

[tasks."android:qr-e2e"]
description = "On the QR harness's own emulator AVD (created if missing): Lean decodes the invite from the virtual-scene camera, then pictures from the system Photo Picker and the system camera reach Lean and are stored as QOI; logcat, screenshots and the stored pictures in out/qr-e2e"
depends = ["android:qr-apk"]
run = "platforms/android/qr/test/e2e.sh out/leanqr.apk out/qr-e2e"

# iOS (platforms/ios), on the Mac

[tasks."ios:sim"]
description = "The app in the iOS Simulator on the Mac (take it with mac-turn first; platforms/ios/README.md): build, install, launch with the chaos data, a screenshot in out/ios-sim"
run = "platforms/ios/ship.sh sim"

[tasks."ios:sim-e2e"]
description = "Build and run in the iOS Simulator: scroll, tap, long-press, type and send, checked in Lean's state; logs, screenshots and xcresult in out/ios-sim even on failure"
run = "tests/app/mobile.sh ios"

[tasks."ios:photo-e2e"]
description = "Build/setup the private iOS simulator via MAC; seed Photos and run native picker cancellation, oriented bounded decode and send"
run = "PHOTO_ONLY=1 platforms/ios/ship.sh e2e"

[tasks."ios:device"]
description = "The app built and signed for an iPhone on the Mac (installs nothing; platforms/ios/ship.sh run installs and launches)"
run = "platforms/ios/ship.sh device"

[tasks."ios:mdns"]
description = "The network probe in the iOS Simulator (platforms/ios/probe): Lean's TCP out and in, and lean-mdns both ways (the app logs the Mac's dns-sd -R probe; dns-sd -B and -L see the app's _leanquiet._udp announcement); report in out/ios-sim/probe-sim.txt"
run = "platforms/ios/ship.sh mdns"

[tasks."ios:mdns-device"]
description = "The network probe on the iPhone (DEVICE; ask before using it): as ios:mdns, over the Mac's Wi-Fi; report in out/ios-sim/probe-device.txt"
run = "platforms/ios/ship.sh mdns-device"

[tasks."ios:e2e"]
description = "End to end on the iPhone (DEVICE; ask before using it): build, install, launch, then over the Mac's Wi-Fi the chaos data, Lean's state and frames drawn; console in out/ios-device"
run = "platforms/ios/ship.sh e2e-device"

# mDNS on this machine's network

[tasks."mdns:e2e"]
description = "Real multicast on this machine's network: Lean to Lean, Lean to avahi, avahi to Lean (needs avahi-daemon + avahi-utils); logs in out/mdns-e2e"
run = "tests/mdns/e2e.sh"

[tasks."ios:ctl-guard"]
description = "Who can drive the iOS app's control channel, in the Mac's simulator (take the Mac first with mac-turn): no token or a wrong one gets nothing, the launch's token is answered, the Mac's Wi-Fi address is refused, a RELEASE=1 build neither listens nor holds a listener"
run = "platforms/ios/ship.sh ctl-guard"

[tasks."android:ctl-guard"]
description = "Who can drive the app's control channel, on your own emulator (SERIAL, default emulator-5644): adb is answered, another app's uid is refused, a RELEASE=1 build does not listen"
depends = ["android:apk"]
run = "platforms/android/test/ctl_guard.sh ${SERIAL:-emulator-5644}"

[tasks."android:release-e2e"]
description = "Build both APK modes; setup a private AVD; verify release packaging, control isolation and external-input scrolling with paired CPU measurements"
depends = ["android:runtime"]
run = "bash platforms/android/test/release_e2e.sh"

[tasks."test:harden"]
description = "Daybreak sync regressions: read traces, deadlines, purge, hostile holds, backpressure and TCP socket limits"
run = "tests/engine/harden.sh"

[tasks."test:bidi"]
description = "Unicode 16 paragraph bidi conformance, indexed number-run checks and issue #3 regressions"
run = "tests/app/bidi.sh"

[tasks."host:bidi"]
description = "Send Hebrew and Arabic clocks through the headless app and compare their rendered pixels with logical 12:30"
run = "tests/app/bidi_host.sh"

[tasks."test:bidi-negative"]
description = "Temporarily break bidi passes, number proofs and clock painting; require failures and restore sources"
run = "python3 tests/app/bidi_negative.py"

[tasks."host:lifecycle"]
description = "Lifecycle, production reader teardown, parked writes and same-store crash restoration"
depends = ["crypto"]
run = "tests/app/lifecycle.sh"

[tasks."host:reader-request-negative"]
description = "Deterministic SQLite reader request interleaving and torn-generation negative control"
depends = ["crypto"]
run = "bash tests/app/reader_request_negative.sh"

[tasks."engine:restart"]
description = "Stop a retained runner, explicitly close its listener, and restart on the same port"
depends = ["crypto"]
run = "tests/engine/restart.sh"

[tasks."host:lifecycle-node"]
description = "Chaos through pending boot and a full node channel, Home's count, bounded suspend, purge checkpoint deadlocks and checkpoint retries under a SQLite write lock"
depends = ["crypto"]
run = "tests/app/lifecycle_node.sh"

[tasks."host:lifecycle-node-negative"]
description = "Mutants of Home's count, bounded teardown, parked writes, and the frame's blocking-call rule"
depends = ["crypto"]
run = "tests/app/lifecycle_node_negative.sh"

[tasks."host:noto"]
depends = ["crypto"]
run = "bash tests/app/noto.sh"

[tasks."host:cjk"]
depends = ["crypto"]
run = "bash tests/app/cjk.sh"

[tasks."host:font-contract"]
depends = ["crypto"]
run = "bash tests/app/font_contract.sh"

[tasks."host:inkless"]
description = "Every painted font/fallback glyph with no ink normalizes as invisible or space, with negative controls"
depends = ["crypto"]
run = "lake build inkless && .lake/build/bin/inkless && tests/app/inkless_negative.sh"

[tasks."host:seam"]
description = "Raw gestures and running placement through the C twin"
run = "tests/app/seam.sh"

[tasks."host:slide"]
description = "Scalar vsync export audit and native thread checks"
run = "tests/app/slide.sh"

[tasks."host:translate"]
description = "Slow Lean frames with motion and placeholder coverage at every vsync"
run = "tests/app/translate.sh"

[tasks."host:seam-negative"]
description = "Break seam laws and native behavior, require detection, restore sources"
run = "python3 tests/app/seam_negative.py"

[tasks."host:slide-negative"]
description = "Break slide laws and native behavior, require detection, restore sources"
run = "python3 tests/app/slide_negative.py"

[tasks."host:translate-negative"]
description = "Break translate laws and native behavior, require detection, restore sources"
run = "python3 tests/app/translate_negative.py"

[tasks."host:theme-restart"]
description = "Appearance preference restored by a fresh process, all three settings"
run = "tests/app/appearance.sh restart"

[tasks."host:theme-live"]
description = "Live OS switches, fresh versus cached pixels, composited contrast, both phone sizes"
run = "tests/app/appearance.sh live"

[tasks."host:theme-negative"]
description = "Reject faults in appearance persistence, contrast and cache invalidation"
run = "lake build appearance app.Proofs && python3 tests/app/theme-negative.py && python3 tests/app/theme-paint-negative.py"

[tasks."linux:demo-video"]
description = "Record the real Linux app resizing from desktop to mobile and changing appearance (Xvfb, xdotool, ImageMagick, ffmpeg)"
depends = ["linux:build"]
run = "python3 platforms/linux/demo.py"

[tasks."host:safe"]
description = "Build and exercise real App.step across safe areas, rotation, keyboard, transient overlays and native bar recreation"
depends = ["crypto"]
run = "tests/app/host_safe.sh"

[tasks."host:safe-negative"]
description = "Safe-area geometry, toast, bar lifecycle and hit-test mutation controls"
run = "python3 tests/app/safe_negative.py"

[tasks."host:bar-state"]
description = "Compile and test Android bar choices across window recreation"
run = "tests/app/bar_state.sh"

[tasks."android:phone-apk"]
description = "Build the current arm64 app for a physical phone, reusing LEANRT when provided (otherwise build the Android runtime)"
run = "[ -f \"${LEANRT:-out/leanrt}/arm64-v8a/libInit.a\" ] || mise run android:runtime; [ -f assets/font.bin ] || tools/fetch_assets.sh; platforms/android/twin/build_apk.sh out/quiet-phone.apk com.holmes.leanquiet 'Lean Quiet' Main arm64-v8a"

[tasks."android:scroll-measure"]
description = "Provisioned phone: build/install preserving data, cold-start scroll recording and logs; requires SERIAL and an existing conversation"
depends = ["android:phone-apk"]
run = "python3 tests/app/pixel_scroll.py"

[tasks."test:stateless"]
description = "Full and capped window syncs on real Nodes/SQLite, peaks and negative controls"
run = "tests/engine/stateless.sh"

[tasks."test:simplify"]
description = "Sync sessions: delayed keepalives on two SQLite nodes, independent rooms, secrecy, purges and negative controls"
run = "tests/engine/simplify.sh"

[tasks."test:read-plan"]
description = "Exact SQLite plans/counts and ordered unions against the model, with proof mutation controls"
run = "tests/engine/read_plan.sh"

[tasks."test:claim-tree"]
description = "Actual RBSR at logarithmic depth, its checked laws, and runtime mutation controls"
run = "tests/engine/claim_tree.sh"

[tasks."test:people-reader"]
description = "Bounded people header, full membership list, cached removal invalidation and controls"
run = "tests/app/people_reader.sh"

[tasks."test:zoom"]
description = "Build and verify browser zoom, running layout proofs, arbitrary Noto raster sizes, native input/restart, and libquiet full-image parity"
run = "tests/zoom/run.sh"

[tasks."android:zoom"]
description = "Build both Android ABIs, create/boot an owned API 36 emulator, exercise live OS text sizes and retain screenshots/logcat"
run = "tests/zoom/android.sh"

# macOS uses the same platforms.desktop.Main loop as Linux, through AppKit.
[tasks."macos:build"]
description = "Build the current shared desktop for Apple Silicon on MAC via SSH (Xcode required)"
run = "platforms/macos/ship.sh build"

[tasks."macos:run"]
description = "Build and launch the shared desktop Mac app; preserve its Application Support data"
run = "platforms/macos/ship.sh run"

[tasks."macos:e2e"]
description = "Build/setup the Mac app, drive OS typing/send, zoom and resize, and verify restart persistence and snapshots"
run = "platforms/macos/ship.sh e2e"

[tasks."host:skeleton"]
description = "Shared message skeleton pixels, density/theme/clipping and actual app/native publication parity"
depends = ["crypto"]
run = "tests/app/skeleton.sh"

[tasks."host:mobile-switcher"]
description = "Shared phone switcher: native densities, identity, real tap dispatch and scroll extent"
run = "tests/app/mobile_switcher.sh"

[tasks."test:vacuity"]
depends = ["crypto"]
description = "Build production laws, kernel-check concrete premise witnesses, reject broken fixtures and check the complete README inventory"
run = "bash tests/vacuity/check.sh"

[tasks."ios:input-device-e2e"]
description = "Build/sign app and XCUITest runner; verify short vs long presses on a seeded physical iPhone; retain xcresult and screenshots"
run = "APPLE_SDKS=iphoneos IOS_BUILD_ACTION=build-for-testing platforms/ios/ship.sh input-device"

[tasks."test:crypto-failure"]
description = "Build production Lean crypto wrappers and test native seal failure handling, real Rust success bytes and malformed input guards"
depends = ["crypto"]
run = "bash tests/engine/crypto_failure.sh"

[tasks."site:build"]
description = "The join page (site/join.html) built into out/site: its policy's script and style hashes filled in"
run = "python3 site/build.py out/site"

[tasks."site:test"]
description = "The join page in headless Chromium: a real invite from the app links leanquiet://join/ with exactly its fields; anything else after # is broken and links nowhere; no external loads; a wrong-hash negative control. Needs Chromium's headless shell (CHROME or Playwright's)"
run = "lake build linkcheck && python3 site/test.py"

[tasks."site:publish"]
description = "Publishes the join page to the gh-pages branch (GitHub Pages: holmesworcester.github.io/lean-quiet/join); pass --mac-url / --testflight-url once they exist"
depends = ["site:test"]
run = "site/publish.sh"

[tasks."android:links-e2e"]
description = "Invite links on a suite-owned AVD: leanquiet://join/ cold and warm into the development APK, malformed links ignored, quiet:// not claimed; RELEASE_APK=out/release/lean-quiet-android.apk adds the release APK"
depends = ["android:runtime"]
run = "bash platforms/android/test/links_e2e.sh"

[tasks."release:android"]
description = "The Android release APK (tools/release/android.sh VERSION), signed with the release key in ~/.config/lean-quiet/release, then checked on an AVD (android:links-e2e with RELEASE_APK)"
run = "tools/release/android.sh ${VERSION:?set VERSION=X.Y.Z} && RELEASE_APK=out/release/lean-quiet-android.apk bash platforms/android/test/links_e2e.sh"

[tasks."release:linux"]
description = "The Linux release tarball (tools/release/linux.sh VERSION), then the installed-links e2e"
run = "tools/release/linux.sh ${VERSION:?set VERSION=X.Y.Z}"

[tasks."release:publish"]
description = "GitHub release vVERSION of out/release/* with SHA256SUMS (tools/release/publish.sh)"
run = "tools/release/publish.sh ${VERSION:?set VERSION=X.Y.Z} ${NOTES:-}"

[tasks."windows:input"]
description = "Deterministic Windows Unicode/editor boundary tests with sanitizers"
run = "platforms/windows/input_test.sh"

[tasks."windows:build"]
description = "Stage shared Lean code and build the native Windows app in the VM"
run = "platforms/windows/ship.sh build"

[tasks."windows:e2e"]
description = "Build/setup, real Windows UI, persistence and encrypted TCP lifecycle tests"
run = "platforms/windows/ship.sh e2e"

[tasks."windows:run"]
description = "Build, install a desktop shortcut and launch Lean Quiet in Windows"
run = "platforms/windows/ship.sh run"

# The development workspace (tools/workspace): the op tree on disk with its
# planned entries, live component previews, and Lean compiled to WASM.
[tasks."workspace:setup"]
description = "Install the workspace's locked npm dependencies"
run = "npm ci --prefix tools/workspace"

[tasks."workspace:layout"]
description = "Regenerate docs/OP_TREE.txt: the op tree on disk under app/, with the planned entries of tools/workspace/layout/tree.json and LAYOUT02"
run = "python3 tools/workspace/tools/plan.py --write-tree docs/OP_TREE.txt"

[tasks."workspace:build"]
description = "Read the op tree on disk (rejects a stale docs/OP_TREE.txt), check the kernel's Lean proofs, compile it to WASM, and bundle the page"
depends = ["workspace:setup"]
run = "python3 tools/workspace/tools/build.py"

[tasks."workspace:test"]
description = "The tree is the files on disk under app/, each once with its contents, and every planned entry is absent and required; WASM matches native Lean"
depends = ["workspace:build"]
run = "npm test --prefix tools/workspace"

[tasks."workspace:browser-setup"]
description = "Install Playwright's Chromium unless PLAYWRIGHT_CHROMIUM_EXECUTABLE or CHROME names one"
depends = ["workspace:setup"]
run = "if [ -z \"${PLAYWRIGHT_CHROMIUM_EXECUTABLE:-${CHROME:-}}\" ]; then cd tools/workspace && npx playwright install chromium; fi"

[tasks."workspace:e2e"]
description = "Every folder and file of the tree opens to its real contents; links, shared preview state, network delivery and phone layout in headless Chromium"
depends = ["workspace:test", "workspace:browser-setup"]
run = "cd tools/workspace && PLAYWRIGHT_CHROMIUM_EXECUTABLE=${PLAYWRIGHT_CHROMIUM_EXECUTABLE:-${CHROME:-}} WORKSPACE_PORT=${WORKSPACE_PORT:-4175} npx playwright test"

[tasks."workspace:runtime"]
description = "Provision the optional browser Lean runtime with pinned checksums (~310 MiB)"
run = "python3 tools/workspace/tools/runtime.py"

[tasks."workspace:prover"]
description = "Real in-browser proof acceptance and rejection (needs workspace:runtime)"
depends = ["workspace:build", "workspace:browser-setup", "workspace:runtime"]
run = "cd tools/workspace && PLAYWRIGHT_CHROMIUM_EXECUTABLE=${PLAYWRIGHT_CHROMIUM_EXECUTABLE:-${CHROME:-}} QUIET_TEST_PROVER=1 npx playwright test tests/browser/prover.spec.js"

[tasks."workspace:serve"]
description = "Build and serve the workspace on 127.0.0.1:4173 with browser isolation headers"
depends = ["workspace:build"]
run = "python3 tools/workspace/tools/serve.py"
