name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  proofs-and-tests:
    runs-on: ubuntu-24.04
    env:
      ELAN_HOME: ${{ github.workspace }}/.elan
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (SQLite, libsodium)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libsodium23
      - name: Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
      - uses: jdx/mise-action@v2
      - run: mise run check
      - run: mise run test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: out/
