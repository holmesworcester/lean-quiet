# The engine's crypto, one implementation on every platform (desktop,
# Android, iOS): libquiet's pure-Rust crates at libquiet's versions,
# behind a C ABI the Lean externs call (native/crypto.c).
[package]
name = "lq_crypto"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc", "zeroize"] }
curve25519-dalek = { version = "=5.0.0", default-features = false, features = ["zeroize"] }
# `zeroize` turns back on the wiping 0.11 made optional (see libquiet's
# Cargo.toml): the Poly1305 one-time key and the cipher state.
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
sha2 = "=0.10.9"
getrandom = "=0.3.4"
zeroize = "1.8"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
