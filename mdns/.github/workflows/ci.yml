name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "ELAN_HOME=$HOME/.elan" >> "$GITHUB_ENV"
      - run: mise run check
        env: { TMPDIR: /tmp }
  e2e:
    # Multicast on the runner's own interfaces, against the avahi it installs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: elan and avahi
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "ELAN_HOME=$HOME/.elan" >> "$GITHUB_ENV"
          sudo apt-get update && sudo apt-get install -y avahi-daemon avahi-utils
          sudo systemctl start avahi-daemon
      - run: mise run e2e
        env: { TMPDIR: /tmp }
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-logs, path: out/e2e }
