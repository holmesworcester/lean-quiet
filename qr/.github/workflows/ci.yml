# The gate on every push and PR; the emulator end to end on a schedule or
# by hand. Runner prerequisites: elan (Lean 4.34.0 from lean-toolchain),
# python3 with numpy and Pillow; the cross-checks install qrencode and
# zbar-tools from apt and segno/qrcodegen from PyPI. The e2e job needs a
# self-hosted runner with KVM, the Android SDK (NDK, build-tools,
# platform android-35+, emulator, system-images;android-36;google_apis;x86_64),
# Lean's and libuv's sources (LEAN_SRC, UV_SRC) and python3.13 with grpcio
# and grpcio-tools. Failure artifacts are kept.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      ELAN_HOME: ${{ github.workspace }}/.elan
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: elan, python, independent QR tools
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          sudo apt-get update && sudo apt-get install -y qrencode zbar-tools python3-numpy python3-pil
          python3 -m pip install --user --break-system-packages segno qrcodegen
      - run: mise run check
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check
          path: |
            out/camera/
            out/xcheck/

  android-e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, kvm, android]
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run android:runtime
      - run: mise run android:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e
          path: out/e2e/
