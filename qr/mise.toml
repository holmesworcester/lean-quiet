# Named tasks; CI (.github/workflows/ci.yml) runs these same tasks.
[env]
ELAN_HOME = "{{ env.ELAN_HOME | default(value='/mnt/storage/elan') }}"
TMPDIR = "{{ env.TMPDIR | default(value='/mnt/storage/holmes-tmp') }}"

[tasks.check]
description = "The deterministic gate: laws proven on standard axioms, escape-hatch scan, codec and frame suite, camera frames, cross-checks with qrencode/zbarimg/segno/qrcodegen, negative controls"
run = "tests/check.sh"

[tasks."android:runtime"]
description = "Lean's runtime, Init and libuv cross-built for Android into out/leanrt (needs LEAN_SRC at v4.34.0 and UV_SRC at v1.51.0)"
run = "android/leanrt/build.sh \"${LEAN_SRC:-/mnt/storage/holmes-wt/lean-src/lean4}\" \"${UV_SRC:-/mnt/storage/holmes-wt/lean-src/libuv}\" out/leanrt x86_64 arm64-v8a"

[tasks."android:apk"]
description = "The camera harness APK (x86_64 for the emulator, arm64-v8a for phones)"
run = "[ -f out/leanrt/x86_64/libInit.a ] || mise run android:runtime; \"$ELAN_HOME/bin/lake\" build qr_tool && android/app/build_apk.sh out/leanqr.apk x86_64 arm64-v8a"

[tasks."android:e2e"]
description = "On the harness's own emulator AVD (created if missing): Lean decodes the invite from the virtual-scene camera; logcat and a screenshot in out/e2e"
depends = ["android:apk"]
run = "android/test/e2e.sh out/leanqr.apk out/e2e"
